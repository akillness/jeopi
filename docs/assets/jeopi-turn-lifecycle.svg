<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1000" width="1160" height="1000" role="img" aria-label="jeopi 에이전트 턴 생명주기">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/></marker><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EC4899"/></marker><marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/></marker><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/></marker></defs>
<title>jeopi 에이전트 턴 생명주기</title><desc>프롬프트 주입부터 스티어링, 컨텍스트 변환, 프로바이더 스트림, 툴 실행, 턴 종료까지 11단계와 각 단계에서 방출되는 AgentEvent 대응표.</desc>
<rect width="1160" height="1000" fill="#0B0B14"/>
<text x="28" y="34" fill="#E6EDF3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="start">에이전트 턴 생명주기 — agentLoop() 한 사이클</text><text x="28" y="54" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">왼쪽은 실행 단계, 오른쪽은 그 시점에 방출되는 AgentEvent. 구독자(TUI·RPC·ACP·SDK)는 모두 같은 스트림을 본다.</text><text x="40" y="84" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">실행 단계  ·  packages/agent/src/agent-loop.ts</text><text x="700" y="84" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">방출 이벤트  ·  AgentEvent (types.ts:712-733)</text><rect x="40" y="100" width="620" height="56" rx="8" fill="#12161F" stroke="#EC4899" stroke-width="1.4"/><text x="350" y="125" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">01  프롬프트 주입</text><text x="350" y="140" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">agentLoop(prompts, context, config)</text><rect x="700" y="103" width="420" height="50" rx="6" fill="#0F1520" stroke="#EC4899" stroke-width="1.2" stroke-dasharray="4 3"/><text x="714" y="123" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">agent_start</text><text x="714" y="138" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">message_start (user)</text><path d="M 662 128 L 696 128" stroke="#EC4899" stroke-width="1.1" fill="none" stroke-dasharray="3 3" marker-end="url(#d)"/><path d="M 64 156 L 64 168" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="40" y="168" width="620" height="56" rx="8" fill="#12161F" stroke="#EC4899" stroke-width="1.4"/><text x="350" y="193" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">02  스티어링 흡수</text><text x="350" y="208" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">getSteeringMessages() · asides 해석</text><path d="M 64 224 L 64 236" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="40" y="236" width="620" height="56" rx="8" fill="#12161F" stroke="#F59E0B" stroke-width="1.4"/><text x="350" y="261" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">03  컨텍스트 변환</text><text x="350" y="276" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">transformContext() → 압축/프루닝 기회</text><path d="M 64 292 L 64 304" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="40" y="304" width="620" height="56" rx="8" fill="#12161F" stroke="#F59E0B" stroke-width="1.4"/><text x="350" y="329" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">04  LLM 메시지 변환</text><text x="350" y="344" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">convertToLlm() · normalizeMessagesForProvider()</text><rect x="700" y="314.5" width="420" height="35" rx="6" fill="#0F1520" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4 3"/><text x="714" y="334.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">turn_start</text><path d="M 662 332 L 696 332" stroke="#F59E0B" stroke-width="1.1" fill="none" stroke-dasharray="3 3" marker-end="url(#g)"/><path d="M 64 360 L 64 372" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="40" y="372" width="620" height="56" rx="8" fill="#12161F" stroke="#F59E0B" stroke-width="1.4"/><text x="350" y="397" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">05  툴 스키마 정규화</text><text x="350" y="412" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">normalizeTools() · intent 필드 i 주입</text><path d="M 64 428 L 64 440" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="40" y="440" width="620" height="56" rx="8" fill="#12161F" stroke="#3B82F6" stroke-width="1.4"/><text x="350" y="465" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">06  크리덴셜 해석</text><text x="350" y="480" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">getApiKey() → ApiKey | ApiKeyResolver</text><path d="M 64 496 L 64 508" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="40" y="508" width="620" height="56" rx="8" fill="#12161F" stroke="#8B5CF6" stroke-width="1.4"/><text x="350" y="533" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">07  프로바이더 스트림</text><text x="350" y="548" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">streamSimple() → stream() → 와이어 API</text><rect x="700" y="511" width="420" height="50" rx="6" fill="#0F1520" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4 3"/><text x="714" y="531" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">message_update × N</text><text x="714" y="546" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">(text/thinking/toolcall delta)</text><path d="M 662 536 L 696 536" stroke="#8B5CF6" stroke-width="1.1" fill="none" stroke-dasharray="3 3" marker-end="url(#c)"/><path d="M 64 564 L 64 576" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="40" y="576" width="620" height="56" rx="8" fill="#12161F" stroke="#8B5CF6" stroke-width="1.4"/><text x="350" y="601" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">08  응답 확정</text><text x="350" y="616" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">salvage · harmony 검사 · stopReason 판정</text><rect x="700" y="586.5" width="420" height="35" rx="6" fill="#0F1520" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4 3"/><text x="714" y="606.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">message_end (assistant)</text><path d="M 662 604 L 696 604" stroke="#8B5CF6" stroke-width="1.1" fill="none" stroke-dasharray="3 3" marker-end="url(#c)"/><path d="M 64 632 L 64 644" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="40" y="644" width="620" height="56" rx="8" fill="#12161F" stroke="#34D399" stroke-width="1.4"/><text x="350" y="669" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">09  툴 실행</text><text x="350" y="684" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">executeToolCalls() · 검증 → 스케줄 → 실행</text><rect x="700" y="639.5" width="420" height="65" rx="6" fill="#0F1520" stroke="#34D399" stroke-width="1.2" stroke-dasharray="4 3"/><text x="714" y="659.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">tool_execution_start</text><text x="714" y="674.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">tool_execution_update × N</text><text x="714" y="689.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">tool_execution_end</text><path d="M 662 672 L 696 672" stroke="#34D399" stroke-width="1.1" fill="none" stroke-dasharray="3 3" marker-end="url(#f)"/><path d="M 64 700 L 64 712" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="40" y="712" width="620" height="56" rx="8" fill="#12161F" stroke="#34D399" stroke-width="1.4"/><text x="350" y="737" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">10  결과 병합</text><text x="350" y="752" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">coerceToolResult() · toolResult 메시지 append</text><rect x="700" y="722.5" width="420" height="35" rx="6" fill="#0F1520" stroke="#34D399" stroke-width="1.2" stroke-dasharray="4 3"/><text x="714" y="742.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">message_start/end (toolResult)</text><path d="M 662 740 L 696 740" stroke="#34D399" stroke-width="1.1" fill="none" stroke-dasharray="3 3" marker-end="url(#f)"/><path d="M 64 768 L 64 780" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="40" y="780" width="620" height="56" rx="8" fill="#12161F" stroke="#EC4899" stroke-width="1.4"/><text x="350" y="805" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" font-weight="600" text-anchor="middle">11  턴 종료</text><text x="350" y="820" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">emitTurnEnd() · onTurnEnd 훅 await</text><rect x="700" y="790.5" width="420" height="35" rx="6" fill="#0F1520" stroke="#EC4899" stroke-width="1.2" stroke-dasharray="4 3"/><text x="714" y="810.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">turn_end</text><path d="M 662 808 L 696 808" stroke="#EC4899" stroke-width="1.1" fill="none" stroke-dasharray="3 3" marker-end="url(#d)"/><path d="M 620 836 L 668 836 L 668 862 L 22 862 L 22 128 L 38 128" stroke="#22D3EE" stroke-width="1.6" fill="none" marker-end="url(#e)"/><text x="80" y="878" fill="#22D3EE" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">툴 호출이 있었으면 다시 03 으로 — 툴 결과가 다음 턴의 입력이 된다</text><text x="80" y="894" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">툴 호출이 없으면 agent_end 로 종료</text><rect x="700" y="866" width="420" height="34" rx="6" fill="#0F1520" stroke="#EC4899" stroke-width="1.2"/><text x="714" y="887" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">agent_end { messages, telemetry?, coverage? }</text><rect x="40" y="914" width="1080" height="66" rx="8" fill="#1A1206" stroke="#F59E0B" stroke-width="1.2"/><text x="56" y="935" fill="#F59E0B" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="700" text-anchor="start">재샘플링 상한 (무한 루프 방지)</text><text x="56" y="954" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">MAX_PAUSED_TURN_CONTINUATIONS = 8   비종결 stop 재샘플     MAX_LENGTH_TRUNCATE_CONTINUATIONS = 8   length 절단 재샘플</text><text x="56" y="970" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="start">MAX_SOFT_TOOL_ESCALATIONS = 3   soft tool 요구 강제 승격      deadline   절대 벽시계 마감 (Unix epoch ms)</text>
</svg>