<title>jeopi 서빙 구조</title><desc>cli.ts 엔트리에서 워커 재진입과 모드 분기를 거쳐 AgentSession, agentLoop, jeopi-ai 스트림 디스패치, 14종 와이어 프로토콜로 내려가는 계층도.</desc>
