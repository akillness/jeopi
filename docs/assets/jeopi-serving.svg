<text x="28" y="34" fill="#E6EDF3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="start">jeopi 서빙 구조 — 단일 엔트리, 다중 표면</text><text x="28" y="54" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">cli.ts 하나가 워커 호스트이자 모드 디스패처. 세션 아래는 모든 표면이 동일한 코드 경로를 공유한다.</text><rect x="40" y="82" width="250" height="54" rx="8" fill="#2A1020" stroke="#EC4899" stroke-width="1.4"/><text x="165" y="106" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">cli.ts</text><text x="165" y="121" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">worker host + 명령 레지스트리</text><text x="304" y="100" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">① declareWorkerHostEntry() 로 자신을 워커 호스트로 선언</text><text x="304" y="116" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">② 숨은 argv 셀렉터(__omp_worker_*) 먼저 처리 → 재진입</text><text x="304" y="132" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">③ 아니면 명령 레지스트리 로드 → main.ts</text><rect x="830" y="78" width="300" height="62" rx="8" fill="#12161F" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="4 3"/><text x="980" y="106" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">Worker 재진입</text><text x="980" y="121" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">stats_sync · tab · js_eval · tiny_inference</text><path d="M 165 82 L 165 68 L 900 68 L 900 76" stroke="#F59E0B" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#g)"/><rect x="40" y="164" width="250" height="50" rx="8"