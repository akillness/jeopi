<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 840" width="1160" height="840" role="img" aria-label="jeopi 프로바이더 제공 구조">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#30363D"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3B82F6"/></marker><marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/></marker><marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EC4899"/></marker><marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/></marker><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34D399"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/></marker></defs>
<title>jeopi 프로바이더 제공 구조</title><desc>카탈로그 반쪽과 인증 반쪽으로 선언된 프로바이더가 ModelRegistry 조립, 가용성 판정, 크리덴셜 우선순위를 거쳐 model.api 기준 14종 와이어 프로토콜로 디스패치되는 흐름.</desc>
<rect width="1160" height="840" fill="#0B0B14"/>
<text x="28" y="34" fill="#E6EDF3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="start">프로바이더 제공 구조 — 카탈로그 / 레지스트리 두 반쪽</text><text x="28" y="54" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">프로바이더 하나 = 카탈로그 엔트리 1줄 + ProviderDefinition 1개. 스트림 분기는 provider 가 아니라 model.api 로 한다.</text><rect x="40" y="84" width="480" height="128" rx="10" fill="#0D1420" stroke="#3B82F6" stroke-width="1.4"/><text x="280" y="152.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle"></text><text x="60" y="108" fill="#3B82F6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start">카탈로그 반쪽 · packages/catalog</text><text x="60" y="130" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" text-anchor="start">CATALOG_PROVIDERS  (provider-models/descriptors.ts)</text><text x="60" y="150" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">id · defaultModel · envVars · createModelManagerOptions</text><text x="60" y="168" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">allowUnauthenticated · dynamicModelsAuthoritative · catalogDiscovery</text><text x="60" y="192" fill="#3B82F6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">→ KnownProvider · PROVIDER_DESCRIPTORS · DEFAULT_MODEL_PER_PROVIDER 파생</text><rect x="560" y="84" width="560" height="128" rx="10" fill="#150F26" stroke="#8B5CF6" stroke-width="1.4"/><text x="840" y="152.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle"></text><text x="580" y="108" fill="#8B5CF6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start">인증 반쪽 · packages/ai/src/registry</text><text x="580" y="130" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" text-anchor="start">ProviderDefinition  (registry/&lt;id&gt;.ts → ALL 배열)</text><text x="580" y="150" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">id · name · envKeys · login · refreshToken</text><text x="580" y="168" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">storeCredentialsAs · callbackPort · pasteCodeFlow</text><text x="580" y="192" fill="#8B5CF6" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">→ OAuthProvider · /login 목록 · refresh 디스패치 파생</text><text x="590" y="236" fill="#F59E0B" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="700" text-anchor="middle">컴파일 타임 정합성 강제</text><text x="590" y="254" fill="#8B949E" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" text-anchor="middle">Exclude&lt;KnownProvider, RegistryDef["id"]&gt; extends never   (registry.ts:156-160)</text><path d="M 280 212 L 470 240" stroke="#F59E0B" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#g)"/><path d="M 880 212 L 700 240" stroke="#F59E0B" stroke-width="1.4" fill="none" stroke-dasharray="4 3" marker-end="url(#g)"/><rect x="40" y="286" width="1080" height="44" rx="8" fill="#101827" stroke="#3B82F6" stroke-width="1.4"/><text x="580" y="312.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" font-weight="600" text-anchor="middle">ModelRegistry — 런타임 카탈로그 조립</text><rect x="40" y="348" width="258" height="44" rx="8" fill="#12161F" stroke="#3B82F6" stroke-width="1.4"/><text x="169" y="367" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" text-anchor="middle">① 번들 카탈로그</text><text x="169" y="382" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">models.json (생성물)</text><path d="M 169 348 L 169 332" stroke="#3B82F6" stroke-width="1.4" fill="none" marker-end="url(#b)"/><rect x="314" y="348" width="258" height="44" rx="8" fill="#12161F" stroke="#3B82F6" stroke-width="1.4"/><text x="443" y="367" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" text-anchor="middle">② models.yml</text><text x="443" y="382" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">사용자 커스텀 프로바이더</text><path d="M 443 348 L 443 332" stroke="#3B82F6" stroke-width="1.4" fill="none" marker-end="url(#b)"/><rect x="588" y="348" width="258" height="44" rx="8" fill="#12161F" stroke="#3B82F6" stroke-width="1.4"/><text x="717" y="367" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" text-anchor="middle">③ 런타임 디스커버리</text><text x="717" y="382" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">로컬 엔진 · 게이트웨이</text><path d="M 717 348 L 717 332" stroke="#3B82F6" stroke-width="1.4" fill="none" marker-end="url(#b)"/><rect x="862" y="348" width="258" height="44" rx="8" fill="#12161F" stroke="#3B82F6" stroke-width="1.4"/><text x="991" y="367" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" font-weight="600" text-anchor="middle">④ 익스텐션 등록</text><text x="991" y="382" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">registerCustomApi 등</text><path d="M 991 348 L 991 332" stroke="#3B82F6" stroke-width="1.4" fill="none" marker-end="url(#b)"/><rect x="40" y="420" width="1080" height="46" rx="8" fill="#2A2010" stroke="#F59E0B" stroke-width="1.4"/><text x="580" y="440" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">선택 가능(available) 판정</text><text x="580" y="455" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">disabledProviders 에 없음  AND  (keyless 이거나 크리덴셜 해석 성공)  — disabledProviders 를 먼저 검사</text><path d="M 580 392 L 580 418" stroke="#F59E0B" stroke-width="1.4" fill="none" marker-end="url(#g)"/><text x="40" y="496" fill="#E6EDF3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" text-anchor="start">크리덴셜 우선순위 (먼저 매칭되는 것이 이김)</text><rect x="40" y="510" width="172" height="40" rx="6" fill="#1B1226" stroke="#EC4899" stroke-width="1.4"/><text x="126" y="534.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" text-anchor="middle">1  런타임 --api-key</text><path d="M 214 530 L 224 530" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="226" y="510" width="172" height="40" rx="6" fill="#1B1226" stroke="#EC4899" stroke-width="1.4"/><text x="312" y="534.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" text-anchor="middle">2  models.yml apiKey</text><path d="M 400 530 L 410 530" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="412" y="510" width="172" height="40" rx="6" fill="#12161F" stroke="#30363D" stroke-width="1.4"/><text x="498" y="534.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" text-anchor="middle">3  저장된 API 키</text><path d="M 586 530 L 596 530" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="598" y="510" width="172" height="40" rx="6" fill="#12161F" stroke="#30363D" stroke-width="1.4"/><text x="684" y="534.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" text-anchor="middle">4  저장된 OAuth (자동 refresh)</text><path d="M 772 530 L 782 530" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="784" y="510" width="172" height="40" rx="6" fill="#12161F" stroke="#30363D" stroke-width="1.4"/><text x="870" y="534.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" text-anchor="middle">5  환경변수 / .env</text><path d="M 958 530 L 968 530" stroke="#30363D" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="970" y="510" width="172" height="40" rx="6" fill="#12161F" stroke="#30363D" stroke-width="1.4"/><text x="1056" y="534.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" text-anchor="middle">6  models.yml 폴백 리졸버</text><text x="40" y="568" fill="#EC4899" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">2번이 4번을 의도적으로 이긴다 — 게이트웨이용으로 준 키 대신 업스트림 OAuth 토큰을 흘려보내면 프록시가 거부하기 때문.</text><rect x="40" y="600" width="1080" height="46" rx="8" fill="#161029" stroke="#8B5CF6" stroke-width="1.4"/><text x="580" y="620" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">stream() → streamDispatch()   ·   packages/ai/src/stream.ts:706-842</text><text x="580" y="635" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">분기 순서: 커스텀 API 레지스트리 → GitLab Duo → Vertex(ADC) / Bedrock(AWS 체인) → 키 확인 → switch (model.api)</text><path d="M 580 466 L 580 598" stroke="#8B5CF6" stroke-width="1.4" fill="none" marker-end="url(#c)"/><rect x="40" y="676" width="145.8" height="32" rx="6" fill="#12161F" stroke="#34D399" stroke-width="1.4"/><text x="112.9" y="696.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">openai-completions</text><rect x="195.8" y="676" width="131.6" height="32" rx="6" fill="#12161F" stroke="#34D399" stroke-width="1.4"/><text x="261.6" y="696.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">openai-responses</text><rect x="337.4" y="676" width="120" height="32" rx="6" fill="#12161F" stroke="#34D399" stroke-width="1.4"/><text x="397.4" y="696.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">openrouter</text><rect x="467.4" y="676" width="174.2" height="32" rx="6" fill="#12161F" stroke="#34D399" stroke-width="1.4"/><text x="554.5" y="696.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">openai-codex-responses</text><rect x="651.5999999999999" y="676" width="174.2" height="32" rx="6" fill="#12161F" stroke="#34D399" stroke-width="1.4"/><text x="738.6999999999999" y="696.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">azure-openai-responses</text><rect x="835.8" y="676" width="145.8" height="32" rx="6" fill="#12161F" stroke="#EC4899" stroke-width="1.4"/><text x="908.6999999999999" y="696.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">anthropic-messages</text><rect x="40" y="716" width="181.29999999999998" height="32" rx="6" fill="#12161F" stroke="#F59E0B" stroke-width="1.4"/><text x="130.64999999999998" y="736.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">bedrock-converse-stream</text><rect x="231.29999999999998" y="716" width="160" height="32" rx="6" fill="#12161F" stroke="#3B82F6" stroke-width="1.4"/><text x="311.29999999999995" y="736.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">google-generative-ai</text><rect x="401.29999999999995" y="716" width="138.7" height="32" rx="6" fill="#12161F" stroke="#3B82F6" stroke-width="1.4"/><text x="470.65" y="736.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">google-gemini-cli</text><rect x="550" y="716" width="120" height="32" rx="6" fill="#12161F" stroke="#3B82F6" stroke-width="1.4"/><text x="610" y="736.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">google-vertex</text><rect x="680" y="716" width="120" height="32" rx="6" fill="#12161F" stroke="#22D3EE" stroke-width="1.4"/><text x="740" y="736.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">ollama-chat</text><rect x="810" y="716" width="120" height="32" rx="6" fill="#12161F" stroke="#8B5CF6" stroke-width="1.4"/><text x="870" y="736.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">cursor-agent</text><rect x="940" y="716" width="131.6" height="32" rx="6" fill="#12161F" stroke="#8B5CF6" stroke-width="1.4"/><text x="1005.8" y="736.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">gitlab-duo-agent</text><rect x="40" y="756" width="120" height="32" rx="6" fill="#12161F" stroke="#8B5CF6" stroke-width="1.4"/><text x="100" y="776.5" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600" text-anchor="middle">devin-agent</text><path d="M 580 646 L 580 672" stroke="#8B5CF6" stroke-width="1.4" fill="none" marker-end="url(#c)"/><text x="28" y="818" fill="#E6EDF3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">새 OpenAI 호환 게이트웨이 추가 = 스트리밍 코드 0줄 수정. 새 와이어 프로토콜 추가 시에만 stream.ts / api-registry.ts / catalog types.ts 를 함께 손댄다.</text>
</svg>