<title>jeopi 패키지 의존 그래프</title><desc>natives/hashline/wire 를 기반으로 utils → catalog → ai → agent-core → coding-agent(jeopi-cli) 로 쌓이는 7계층 단방향 의존 그래프.</desc>
<rect width="1080" height="720" fill="#0B0B14"/>
<text x="28" y="34" fill="#E6EDF3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="start">jeopi 패키지 의존 그래프</text><text x="28" y="54" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">화살표 = 런타임 의존 (package.json dependencies). 아래 계층은 위 계층만 참조한다.</text><text x="28" y="96" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">L0 · 무의존 기반</text><rect x="150" y="78" width="168" height="46" rx="8" fill="#1A1410" stroke="#DEA584" stroke-width="1.4"/><text x="234" y="98" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">jeopi-natives</text><text x="234" y="113" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">Rust NAPI: grep/text/pty</text><rect x="340" y="78" width="168" height="46" rx="8" fill="#1A1410" stroke="#DEA584" stroke-width="1.4"/><text x="424" y="98" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">jeopi-hashline</text><text x="424" y="113" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">앵커드 패치 포맷</text><rect x="530" y="78" width="168" height="46" rx="8" fill="#1A1410" stroke="#DEA584" stroke-width="1.4"/><text x="614" y="98" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">jeopi-wire</text><text x="614" y="113" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">collab 와이어 타입</text><text x="28" y="176" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">L1 · 공용 유틸</text><rect x="150" y="158" width="168" height="46" rx="8" fill="#101827" stroke="#3B82F6" stroke-width="1.4"/><text x="234" y="178" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">jeopi-utils</text><text x="234" y="193" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">logger · env · stream</text><text x="28" y="256" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">L2 · 모델 카탈로그</text><rect x="150" y="238" width="168" height="46" rx="8" fill="#101827" stroke="#3B82F6" stroke-width="1.4"/><text x="234" y="258" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">jeopi-catalog</text><text x="234" y="273" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">models.json · descriptors</text><text x="340" y="256" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">CATALOG_PROVIDERS 테이블 · ModelManager</text><text x="340" y="272" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">KnownProvider / KnownApi 유니온의 출처</text><text x="28" y="336" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">L3 · 프로바이더 클라이언트</text><rect x="150" y="318" width="168" height="46" rx="8" fill="#161029" stroke="#8B5CF6" stroke-width="1.4"/><text x="234" y="338" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">jeopi-ai</text><text x="234" y="353" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">stream() · registry · auth</text><text x="340" y="336" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight=