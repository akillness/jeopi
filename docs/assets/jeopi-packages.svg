em-ui,sans-serif" font-size="10.5" text-anchor="middle">메모리 백엔드</text><text x="28" y="496" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">L5 · 에이전트 런타임</text><rect x="150" y="478" width="358" height="46" rx="8" fill="#0F1F1B" stroke="#34D399" stroke-width="1.4"/><text x="329" y="498" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">jeopi-agent-core</text><text x="329" y="513" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">agentLoop · AgentTool · compaction · telemetry</text><text x="530" y="496" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">프로바이더도 UI도 모르는 순수 루프.</text><text x="530" y="512" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">AgentContext + AgentLoopConfig 만 받는다 → SDK 재사용 지점.</text><text x="28" y="576" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">L6 · 제품</text><rect x="150" y="558" width="358" height="46" rx="8" fill="#2A1020" stroke="#EC4899" stroke-width="1.4"/><text x="329" y="578" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">jeopi-cli  (bin: jeopi)</text><text x="329" y="593" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">세션 · 툴 · 모드 · 디스커버리 · SDK</text><rect x="540" y="558" width="168" height="46" rx="8" fill="#1A1018" stroke="#EC4899" stroke-width="1.4" stroke-dasharray="4 3"/><text x="624" y="578" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600" text-anchor="middle">jeopi-swarm-extension</text><text x="624" y="593" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">bin: jeopi-swarm</text><text x="28" y="646" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">L7 · 비공개 보조</text><rect x="150" y="630" width="168" height="40" rx="8" fill="#12161F" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 3"/><text x="234" y="647" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600" text-anchor="middle">collab-relay</text><text x="234" y="662" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">세션 공유 릴레이</text><rect x="340" y="630" width="168" height="40" rx="8" fill="#12161F" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 3"/><text x="424" y="647" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600" text-anchor="middle">collab-web</text><text x="424" y="662" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">브라우저 게스트</text><rect x="530" y="630" width="168" height="40" rx="8" fill="#12161F" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 3"/><text x="614" y="647" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600" text-anchor="middle">terminal-bench</text><text x="614" y="662" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">tb2 러너</text><rect x="720" y="630" width="200" height="40" rx="8" fill="#12161F" stroke="#30363D" stroke-width="1.4" stroke-dasharray="4 3"/><text x="820" y="647" fill="#E6EDF3" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" text-anchor="middle">typescript-edit-benchmark</text><text x="820" y="662" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" text-anchor="middle">편집 정확도 벤치</text><p