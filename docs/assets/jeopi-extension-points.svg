<text x="28" y="34" fill="#E6EDF3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" text-anchor="start">pi 위에 에이전트를 얹는 8가지 확장 지점</text><text x="28" y="54" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11.5" font-weight="400" text-anchor="start">아래로 갈수록 침습도(코드 작성량·결합도)가 커진다. 위쪽에서 해결되면 아래로 내려가지 말 것.</text><text x="40" y="92" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">메커니즘</text><text x="210" y="92" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">정의 위치</text><text x="520" y="92" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">해결하는 문제</text><text x="830" y="92" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">작성 형태</text><text x="1010" y="92" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" text-anchor="start">침습도</text><rect x="30" y="104" width="1100" height="52" rx="8" fill="#0E1218" stroke="#34D399" stroke-width="1.2"/><text x="50" y="135" fill="#E6EDF3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12.5" font-weight="700" text-anchor="start">컨텍스트 파일</text><text x="210" y="135" fill="#34D399" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" text-anchor="start">AGENTS.md · CLAUDE.md</text><text x="520" y="135" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" font-weight="400" text-anchor="start">모든 턴에 규칙 주입</text><text x="830" y="135" fill="#8B949E" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" font-weight="400" text-anchor="start">파일 1개</text><rect x="1010" y="126" width="11" height="11" rx="2.5" fill="#34D399"/><rect x="1026" y="126" width="11" height="11" rx="2.5" fill="#20262F