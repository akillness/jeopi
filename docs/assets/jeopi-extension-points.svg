<title>pi 확장 지점 8종</title><desc>컨텍스트 파일, 스킬, 슬래시 커맨드, 서브에이전트, 훅, MCP 서버, 익스텐션, SDK 임베딩을 침습도 순으로 비교한 선택 가이드 표.</desc>
