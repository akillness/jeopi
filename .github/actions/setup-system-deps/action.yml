name: Setup system deps
description: >-
   Install the canvas/native runtime deps CI needs (cairo/pango stack, fd,
   ripgrep, imagemagick). No-op on a preloaded self-hosted runner image that
   already ships them; self-heals on a stock runner by installing via apt.

runs:
   using: composite
   steps:
      - name: Install system deps (skip when preloaded)
        shell: bash
        # A stalled apt mirror used to wedge this step until the job was killed,
        # and because `release_binary` requires every test job to report
        # `success`, one hung runner silently took down the whole publish chain
        # (tag pushed, nothing shipped). The bounded-retry and mirror-repoint
        # helpers live in the shared library so the other apt call site in
        # `build-native` cannot drift back to the unbounded pattern.
        run: |
           set -euo pipefail
           . "${GITHUB_ACTION_PATH}/../apt-hardening.sh"

           # A preloaded self-hosted runner image bakes these in. Detect that
           # and skip the apt round-trip; otherwise install the exact same set so
           # stock runners (and any future host) still work.
           if command -v fd >/dev/null 2>&1 \
              && command -v rg >/dev/null 2>&1 \
              && command -v magick >/dev/null 2>&1 \
              && pkg-config --exists cairo pango 2>/dev/null; then
             echo "System deps already present (preloaded runner image); skipping apt."
             exit 0
           fi

           apt_harden_sources

           export DEBIAN_FRONTEND=noninteractive
           apt_try "apt-get update" apt-get update
           # Package set is byte-for-byte the original one. An earlier draft added
           # `--no-install-recommends` and broke the install: `imagemagick` is a
           # metapackage whose `convert` binary arrives via a recommended package,
           # so the link below pointed at nothing. Fixing the hang must not change
           # what gets installed.
           apt_try "apt-get install" apt-get install -y \
             libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick

           sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
           sudo ln -sf /usr/bin/convert /usr/local/bin/magick

           # Prove the step did what the rest of the job assumes, rather than
           # letting a partial install surface later as a confusing tool error.
           for tool in fd rg magick; do
             command -v "$tool" >/dev/null 2>&1 || { echo "::error::${tool} missing after install"; exit 1; }
           done
           pkg-config --exists cairo pango || { echo "::error::cairo/pango missing after install"; exit 1; }
